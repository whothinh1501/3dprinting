<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết linh kiện - OEM 3D PARTS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-dark: #1a1a1a;
            --accent-color: #3498db;
            --text-bright: #ffffff;
            --text-gray: #b0b0b0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-gray);
            font-family: 'Inter', sans-serif;
            padding-top: 100px;
        }

        /* Navbar đồng bộ index */
        .navbar {
            background-color: rgba(15, 15, 15, 0.95) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
        }
        .navbar-brand { font-weight: 800; color: var(--accent-color) !important; }

        /* Khung nội dung chính */
        .main-container {
            background-color: var(--card-dark);
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            padding: 30px;
        }

        .product-img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
            border: 1px solid #333;
        }

        .product-title {
            font-weight: 800;
            color: var(--text-bright);
            font-size: 2.2rem;
        }

        .info-label {
            color: #ffffff !important;
            font-weight: 600;
        }
        
        .description-text {
            color: #cfcfcf !important;
            line-height: 1.6;
        }

        .price-text {
            font-size: 2rem;
            font-weight: 700;
            color: #ff4757;
        }

        /* Phần đánh giá */
        .review-item {
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
        }

        .reviewer-name { color: var(--text-bright); font-weight: 700; }
        .review-comment { color: #d0d0d0 !important; 
        
        /* Đường kẻ HR nổi bật hơn */
        hr {
            border-top: 1px solid #444;
            opacity: 1;
        }

        /* Form nhập liệu */
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }
        ::placeholder { color: #777 !important; }

        footer {
            background-color: #0a0a0a;
            padding: 40px 0;
            margin-top: 80px;
            border-top: 1px solid #222;
            color: #888 !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-microchip me-2"></i>OEM 3D PARTS
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-info btn-sm"><i class="fas fa-chevron-left me-2"></i>Trở về cửa hàng</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="part-detail" class="main-container shadow-lg">
            <div class="text-center py-5">
                <div class="spinner-border text-info"></div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-lg-7">
                <h4 class="text-white mb-4 border-bottom pb-2">⭐ Đánh giá từ khách hàng</h4>
                <div id="review-list">
                    </div>
            </div>

            <div class="col-lg-5">
                <div class="main-container py-4">
                    <h5 class="text-white mb-3">Gửi nhận xét của bạn</h5>
                    <form id="review-form">
                        <div class="mb-3">
                            <input type="text" id="reviewerName" class="form-control" placeholder="Tên của bạn" required>
                        </div>
                        <div class="mb-3">
                            <select id="rating" class="form-select">
                                <option value="5">⭐⭐⭐⭐⭐ - Cực kỳ hài lòng</option>
                                <option value="4">⭐⭐⭐⭐ - Rất tốt</option>
                                <option value="3">⭐⭐⭐ - Bình thường</option>
                                <option value="2">⭐⭐ - Kém</option>
                                <option value="1">⭐ - Rất tệ</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <textarea id="comment" class="form-control" rows="3" placeholder="Nhận xét của bạn..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-info w-100 fw-bold text-white shadow">GỬI ĐÁNH GIÁ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            &copy; 2026 Nguyễn Trần Hữu Thịnh - Dự án 2 tuần.
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const partId = urlParams.get('id');

        async function getPartDetail() {
            try {
                const res = await fetch(`http://localhost:5000/api/parts`);
                const parts = await res.json();
                const part = parts.find(p => p._id === partId);
                
                if (part) {
                    document.getElementById('part-detail').innerHTML = `
                        <div class="row g-5">
                            <div class="col-md-5">
                                <img src="${part.imageUrl || 'https://via.placeholder.com/600'}" class="product-img shadow-lg" alt="${part.name}">
                            </div>
                            <div class="col-md-7 d-flex flex-column">
                                <h1 class="product-title mb-3">${part.name}</h1>
                                <div class="mb-4">
                                    <span class="badge bg-info text-dark px-3 py-2 me-2">${part.material}</span>
                                    <span class="text-white-50"><i class="fas fa-hourglass-half me-1"></i>${part.printTime} phút in</span>
                                </div>
                                <h6 class="info-label mb-2">Mô tả linh kiện:</h6>
                                <p class="description-text mb-4">${part.description || 'Linh kiện in 3D chuẩn OEM, chịu lực tốt, độ chính xác cao.'}</p>
                                
                                <div class="mt-auto pt-4 border-top">
                                    <div class="price-text mb-3">${part.price.toLocaleString()} VNĐ</div>
                                    <button onclick="window.location.href='checkout.html?name=${encodeURIComponent(part.name)}&price=${part.price}'" 
                                            class="btn btn-success btn-lg w-100 py-3 fw-bold">
                                        <i class="fas fa-shopping-cart me-2"></i>BẮT ĐẦU ĐẶT IN NGAY
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) { console.error(error); }
        }

        async function getReviews() {
            const res = await fetch(`http://localhost:5000/api/reviews/${partId}`);
            const reviews = await res.json();
            document.getElementById('review-list').innerHTML = reviews.map(r => `
                <div class="review-item border-0">
                    <div class="d-flex justify-content-between">
                        <span class="reviewer-name">${r.reviewerName}</span>
                        <span class="text-warning">${'⭐'.repeat(r.rating)}</span>
                    </div>
                    <p class="review-comment mb-0 mt-2 small">${r.comment}</p>
                </div>
            `).join('') || '<p class="text-muted italic">Sản phẩm này hiện chưa có đánh giá.</p>';
        }

        document.getElementById('review-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                partId: partId,
                reviewerName: document.getElementById('reviewerName').value,
                rating: document.getElementById('rating').value,
                comment: document.getElementById('comment').value
            };
            await fetch('http://localhost:5000/api/reviews', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            location.reload();
        };

        getPartDetail();
        getReviews();
    </script>
</body>
</html>
