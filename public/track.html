<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu đơn hàng - OEM 3D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 700px;">
        <div class="card shadow border-0 p-4">
            <div class="text-center mb-4">
                <h3 class="text-primary fw-bold">🔍 TRA CỨU ĐƠN HÀNG</h3>
                <p class="text-muted">Nhập số điện thoại để xem trạng thái in linh kiện</p>
            </div>

            <div class="input-group mb-4">
                <input type="text" id="trackPhone" class="form-control" placeholder="Nhập số điện thoại của bạn...">
                <button onclick="trackOrder()" class="btn btn-primary px-4">Tìm kiếm</button>
            </div>

            <div id="track-result">
                </div>
            
            <div class="text-center mt-3">
                <a href="index.html" class="text-decoration-none">← Quay lại trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        async function trackOrder() {
            const phone = document.getElementById('trackPhone').value.trim();
            if (!phone) return alert("Vui lòng nhập số điện thoại!");

            try {
                //gọi API lấy tất cả đơn hàng rồi lọc theo SĐT
                const res = await fetch('http://localhost:5000/api/orders');
                const orders = await res.json();
                
                const myOrders = orders.filter(o => o.phone === phone);
                const resultDiv = document.getElementById('track-result');

                if (myOrders.length === 0) {
                    resultDiv.innerHTML = `<div class="alert alert-warning text-center">Không tìm thấy đơn hàng nào cho số điện thoại này!</div>`;
                    return;
                }

                resultDiv.innerHTML = myOrders.map(o => `
                    <div class="card mb-3 border-start border-4 ${getStatusColor(o.status)}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold mb-1">${o.partName}</h6>
                                <span class="badge ${getStatusBadge(o.status)}">${o.status}</span>
                            </div>
                            <p class="small text-muted mb-0">Ngày đặt: ${new Date(o.createdAt).toLocaleDateString('vi-VN')}</p>
                            <p class="fw-bold text-danger mb-0">${o.totalPrice.toLocaleString()} VNĐ</p>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                alert("Lỗi khi tra cứu dữ liệu!");
            }
        }

        function getStatusColor(status) {
            if (status === 'Đã giao') return 'border-success';
            if (status === 'Đang in') return 'border-primary';
            return 'border-warning';
        }

        function getStatusBadge(status) {
            if (status === 'Đã giao') return 'bg-success';
            if (status === 'Đang in') return 'bg-primary';
            return 'bg-warning text-dark';
        }
    </script>
</body>
</html>
