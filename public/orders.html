<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn hàng OEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table td { vertical-align: middle; }
        .status-select { width: 130px; cursor: pointer; }
    </style>
</head>
<body class="bg-light p-4">
    <div class="container card shadow border-0 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0 text-primary">📦 Danh sách Đơn hàng OEM</h3>
            <div>
                <a href="admin.html" class="btn btn-outline-primary me-2">Quản lý Kho</a>
                <a href="index.html" class="btn btn-secondary">Trang chủ</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover border">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 25%;">Khách hàng</th>
                        <th style="width: 30%;">Chi tiết đơn hàng</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái (Update)</th>
                        <th class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="order-list">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const ORDER_API = 'http://localhost:5000/api/orders';

        //lấy danh sách đơn hàng (READ)
        async function fetchOrders() {
            try {
                const res = await fetch(ORDER_API);
                const orders = await res.json();
                const list = document.getElementById('order-list');
                
                if (orders.length === 0) {
                    list.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-muted">Chưa có đơn hàng nào.</td></tr>`;
                    return;
                }

                list.innerHTML = orders.map(o => `
                    <tr>
                        <td>
                            <div class="fw-bold text-dark">${o.customerName}</div>
                            <small class="text-primary font-monospace">📞 ${o.phone || 'N/A'}</small>
                        </td>
                        <td>
                            <div class="fw-bold">${o.partName}</div>
                            <small class="text-muted d-block text-truncate" style="max-width: 250px;">📍 ${o.address || 'N/A'}</small>
                        </td>
                        <td class="text-danger fw-bold text-nowrap">${(o.totalPrice || 0).toLocaleString()} VNĐ</td>
                        <td>
                            <select class="form-select form-select-sm status-select ${getStatusClass(o.status)}" 
                                    onchange="updateOrderStatus('${o._id}', this.value)">
                                <option value="Chờ duyệt" ${o.status === 'Chờ duyệt' ? 'selected' : ''}>Chờ duyệt</option>
                                <option value="Đang in" ${o.status === 'Đang in' ? 'selected' : ''}>Đang in...</option>
                                <option value="Đã giao" ${o.status === 'Đã giao' ? 'selected' : ''}>Đã giao</option>
                                <option value="Đã hủy" ${o.status === 'Đã hủy' ? 'selected' : ''}>Đã hủy</option>
                            </select>
                        </td>
                        <td class="text-center">
                            <button onclick="deleteOrder('${o._id}')" class="btn btn-outline-danger btn-sm">Xóa</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Lỗi khi tải đơn hàng:", err);
            }
        }

        //cập nhật trạng thái
        async function updateOrderStatus(id, newStatus) {
            try {
                const res = await fetch(`${ORDER_API}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    console.log(`Đã cập nhật đơn hàng ${id} sang: ${newStatus}`);
                    fetchOrders();
                }
            } catch (err) {
                alert("Không thể cập nhật trạng thái đơn hàng!");
            }
        }

        function getStatusClass(status) {
            if (status === 'Đã giao') return 'text-success border-success';
            if (status === 'Đang in') return 'text-primary border-primary';
            if (status === 'Đã hủy') return 'text-secondary border-secondary';
            return 'text-warning border-warning';
        }


        async function deleteOrder(id) {
            if (confirm('Thịnh có chắc chắn muốn xóa đơn hàng này không?')) {
                const res = await fetch(`${ORDER_API}/${id}`, { method: 'DELETE' });
                if (res.ok) fetchOrders();
            }
        }

        fetchOrders();
    </script>
</body>
</html>
